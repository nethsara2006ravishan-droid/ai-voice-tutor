<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L All-Subjects AI Tutor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            overflow: hidden;
        }
        header {
            padding: 12px 16px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 110px;
        }
        .message {
            max-width: 90%;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.bot {
            background: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .message.user {
            background: #3b82f6;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .action-btn {
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .speak-btn {
            background: #0284c7;
        }
        .speak-btn:hover {
            background: #0ea5e9;
        }
        .stop-btn {
            background: #ef4444;
        }
        .stop-btn:hover {
            background: #dc2626;
        }
        .message.bot table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 13px;
        }
        .message.bot th, .message.bot td {
            border: 1px solid #475569;
            padding: 8px;
            text-align: left;
        }
        .message.bot th {
            background: #334155;
            color: #38bdf8;
        }
        .message.bot ul, .message.bot ol {
            margin-left: 20px;
            margin-top: 5px;
        }
        #input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #334155;
            z-index: 10;
        }
        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        #user-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 10px 14px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }
        #user-input::placeholder {
            color: #64748b;
        }
        button {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        #mic-btn {
            width: 100%;
            background: #3b82f6;
            border: none;
            color: white;
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        #mic-btn.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <header>
        <div class="header-title">
            <span>🎓</span>
            <span>A/L All-Subjects AI Tutor</span>
        </div>
    </header>

    <div id="chat-container">
        <div class="message bot" id="welcome-msg">
            ආයුබෝවන්! මම ඔබගේ A/L අධ්‍යයන සහಾಯಕ AI ගුරුවරයා. භෞතික විද්‍යාව (Physics), සංයුක්ත ගණිතය (Combined Maths), රසායන විද්‍යාව (Chemistry), ජීව විද්‍යාව (Biology), ICT ඇතුළු ඕනෑම A/L විෂයයකට මගෙන් ප්‍රශ්න අසන්න පුළුවන්.
        </div>
    </div>

    <div id="input-container">
        <button id="mic-btn" type="button" onclick="toggleAudioRecording()">
            <span style="font-size: 22px;">🎙️</span> 
            <span id="mic-text">කතා කරන්න</span>
        </button>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="ප්‍රශ්නයක් මෙහි ලියන්න..." onkeypress="handleKeyPress(event)">
            <button onclick="sendTextMessage()">යවන්න</button>
        </div>
    </div>

    <script>
        function getApiKey() {
            let key = localStorage.getItem('gemini_api_key');
            if (!key) {
                key = prompt("කරුණාකර ඔබගේ Gemini API Key එක ඇතුළත් කරන්න:");
                if (key) {
                    localStorage.setItem('gemini_api_key', key.trim());
                }
            }
            return key ? key.trim() : "";
        }

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let selectedVoice = null;
        const GEMINI_MODEL = "gemini-3.7-flash";

        // Global state object
        let currentAudioState = {
            sentences: [],
            currentIndex: 0,
            isPlaying: false,
            activeSpeakBtn: null,
            activeResetBtn: null,
            currentUtterance: null
        };

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            selectedVoice = voices.find(v => v.lang.includes('si') || v.lang.includes('sinhala')) || voices[0];
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const welcomeDiv = document.getElementById('welcome-msg');
            const welcomeText = welcomeDiv.innerText;
            setupButtonsForMessage(welcomeDiv, welcomeText);
        });

        function setupButtonsForMessage(containerDiv, text) {
            const btnGroup = document.createElement('div');
            btnGroup.className = 'button-group';

            const speakBtn = document.createElement('button');
            speakBtn.className = 'action-btn speak-btn';
            speakBtn.innerHTML = '🔊 අහන්න';

            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn stop-btn';
            resetBtn.innerHTML = '⏹️ මුලටම යන්න';

            speakBtn.onclick = function() {
                handlePlayPause(text, speakBtn, resetBtn);
            };

            resetBtn.onclick = function() {
                hardResetAudio(speakBtn);
            };

            btnGroup.appendChild(speakBtn);
            btnGroup.appendChild(resetBtn);
            containerDiv.appendChild(btnGroup);
        }

        async function toggleAudioRecording() {
            if (!isRecording) {
                try {
                    // Stop any ongoing speech safely without breaking browser api
                    if (currentAudioState.isPlaying) {
                        window.speechSynthesis.pause();
                        currentAudioState.isPlaying = false;
                        if (currentAudioState.activeSpeakBtn) {
                            currentAudioState.activeSpeakBtn.innerHTML = '▶️ දිගටම අහන්න';
                        }
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await sendAudioToGemini(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    
                    const micBtn = document.getElementById('mic-btn');
                    const micText = document.getElementById('mic-text');
                    micBtn.classList.add('recording');
                    micText.innerText = 'ශ්‍රවණය කරමින් පවතී... නැවැත්වීමට නැවත ඔබන්න';
                } catch (err) {
                    console.error("Mic access error:", err);
                    alert("මයික්‍රෆෝන අවසරය ලබා දී ඇත්දැයි බ්‍රවුසර සැකසුම් වලින් පරීක්ෂා කරන්න.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                
                const micBtn = document.getElementById('mic-btn');
                const micText = document.getElementById('mic-text');
                micBtn.classList.remove('recording');
                micText.innerText = 'කතා කරන්න';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') { sendTextMessage(); }
        }

        function blobToBase64(blob) {
            return new Promise((resolve, _) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(blob);
            });
        }

        async function sendTextMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;
            
            if (currentAudioState.isPlaying) {
                window.speechSynthesis.pause();
                currentAudioState.isPlaying = false;
                if (currentAudioState.activeSpeakBtn) {
                    currentAudioState.activeSpeakBtn.innerHTML = '▶️ දිගටම අහන්න';
                }
            }
            
            inputField.value = '';
            await processGeminiRequest(text, null);
        }

        async function sendAudioToGemini(audioBlob) {
            appendMessage("🎙️ [ශ්‍රව්‍ය පණිවිඩයක් යවන ලදී...]", 'user', true);
            const base64Audio = await blobToBase64(audioBlob);
            await processGeminiRequest(null, {
                inlineData: {
                    mimeType: "audio/webm",
                    data: base64Audio
                }
            });
        }

        async function processGeminiRequest(textPart, audioPart) {
            const apiKey = getApiKey();
            if (!apiKey) {
                alert("API Key එකක් ලබා දී නැත!");
                return;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;

            const loadingId = 'loading-' + Date.now();
            appendMessage('සිතමින් පවතී...', 'bot', false, loadingId);

            let partsArray = [
                { text: "ඔබ ශ්‍රී ලංකා උසස් පෙළ (A/L) විෂය නිර්දේශයේ භෞතික විද්‍යාව (Physics), සංයුක්ත ගණිතය (Combined Maths), රසායන විද්‍යාව (Chemistry), ජීව විද්‍යාව (Biology), ICT ඇතුළු ඕනෑම විෂයයක් උගන්වන ඉතා දක්ෂ AI ගුරුවරයෙකි. සිසුන්ට සිංහල භාෂාවෙන් (අවශ්‍ය තැන්වල ඉංග්‍රීසි තාක්ෂණික වචනද සහිතව) පැහැදිලි, නිවැරදි සහ විභාග මට්ටමේ පිළිතුරු ලබා දෙන්න." }
            ];

            if (textPart) {
                appendMessage(textPart, 'user', true);
                partsArray.push({ text: textPart });
            }
            if (audioPart) {
                partsArray.push(audioPart);
                partsArray.push({ text: "කරුණාකර මෙම ශ්‍රව්‍ය පණිවිඩයට සිංහලෙන් සවන් දී අදාළ ප්‍රශ්නයට නිවැරදි පිළිතුර ලබා දෙන්න." });
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: partsArray }]
                    })
                });

                const data = await response.json();
                
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (response.ok && data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage(reply, 'bot', false, null, true);
                } else {
                    console.error("Gemini API Error:", data);
                    const errorMsg = data.error?.message || 'සමාවන්න, දෝෂයක් සිදු විය.';
                    appendMessage('දෝෂයකි: ' + errorMsg, 'bot', true);
                }
            } catch (error) {
                console.error("Network Error:", error);
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                appendMessage('ජාල දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.', 'bot', true);
            }
        }

        function appendMessage(text, sender, isPlainText = false, id = null, addButtons = false) {
            const chatContainer = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            if (id) msgDiv.id = id;

            if (sender === 'bot' && !isPlainText) {
                msgDiv.innerHTML = marked.parse(text);
                if (addButtons) {
                    setupButtonsForMessage(msgDiv, text);
                }
            } else {
                msgDiv.innerText = text;
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handlePlayPause(text, speakBtn, resetBtn) {
            if (!('speechSynthesis' in window)) return;

            // If a different block is playing, pause it first
            if (currentAudioState.isPlaying && currentAudioState.activeSpeakBtn !== speakBtn) {
                window.speechSynthesis.pause();
                if (currentAudioState.activeSpeakBtn) {
                    currentAudioState.activeSpeakBtn.innerHTML = '▶️ දිගටම අහන්න';
                }
            }

            if (currentAudioState.isPlaying) {
                // Currently playing -> Pause it
                window.speechSynthesis.pause();
                currentAudioState.isPlaying = false;
                speakBtn.innerHTML = '▶️ දිගටම අහන්න';
            } else {
                // Not playing -> Check if we need to initialize sentences
                if (currentAudioState.activeSpeakBtn !== speakBtn || currentAudioState.sentences.length === 0) {
                    const cleanText = text.replace(/[*#_`~>\[\]()-]|<[^>]*>?/gm, '');
                    currentAudioState.sentences = cleanText.split(/(?<=[.?!;\n])\s+/).filter(s => s.trim().length > 0);
                    currentAudioState.currentIndex = 0;
                    currentAudioState.activeSpeakBtn = speakBtn;
                    currentAudioState.activeResetBtn = resetBtn;
                }

                currentAudioState.isPlaying = true;
                speakBtn.innerHTML = '⏸️ නවත්වන්න';

                // If speech synthesis was paused mid-way, resume can be buggy on mobile Chrome, 
                // so we safely play the current sentence index forward.
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                } else {
                    playCurrentSentence();
                }
            }
        }

        function playCurrentSentence() {
            if (!currentAudioState.isPlaying) return;

            if (currentAudioState.currentIndex >= currentAudioState.sentences.length) {
                // Finished everything
                currentAudioState.isPlaying = false;
                currentAudioState.currentIndex = 0;
                if (currentAudioState.activeSpeakBtn) {
                    currentAudioState.activeSpeakBtn.innerHTML = '🔊 අහන්න';
                }
                return;
            }

            const sentence = currentAudioState.sentences[currentAudioState.currentIndex];
            const utterance = new SpeechSynthesisUtterance(sentence);
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
            
            utterance.lang = 'si-LK';
            utterance.rate = 0.9;

            currentAudioState.currentUtterance = utterance;

            utterance.onend = function() {
                if (currentAudioState.isPlaying) {
                    currentAudioState.currentIndex++;
                    playCurrentSentence();
                }
            };

            utterance.onerror = function() {
                currentAudioState.isPlaying = false;
                if (currentAudioState.activeSpeakBtn) {
                    currentAudioState.activeSpeakBtn.innerHTML = '🔊 අහන්න';
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function hardResetAudio(speakBtn) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.pause();
                // Clear queue smoothly
                window.speechSynthesis.cancel();
            }
            currentAudioState.isPlaying = false;
            currentAudioState.currentIndex = 0;
            currentAudioState.sentences = [];
            if (speakBtn) {
                speakBtn.innerHTML = '🔊 අහන්න';
            }
        }
    </script>
</body>
</html>
