<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L All-Subjects AI Tutor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            overflow: hidden;
        }
        header {
            padding: 12px 16px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 110px;
        }
        .message {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.bot {
            background: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .message.user {
            background: #3b82f6;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .speak-btn {
            background: #334155;
            border: none;
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .speak-btn:hover {
            background: #475569;
        }
        .message.bot table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 13px;
        }
        .message.bot th, .message.bot td {
            border: 1px solid #475569;
            padding: 8px;
            text-align: left;
        }
        .message.bot th {
            background: #334155;
            color: #38bdf8;
        }
        .message.bot ul, .message.bot ol {
            margin-left: 20px;
            margin-top: 5px;
        }
        #input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #334155;
            z-index: 10;
        }
        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        #user-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 10px 14px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }
        #user-input::placeholder {
            color: #64748b;
        }
        button {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        #mic-btn {
            width: 100%;
            background: #3b82f6;
            border: none;
            color: white;
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        #mic-btn.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <header>
        <div class="header-title">
            <span>🎓</span>
            <span>A/L All-Subjects AI Tutor</span>
        </div>
    </header>

    <div id="chat-container">
        <div class="message bot">ආයුබෝවන්! මම ඔබගේ A/L අධ්‍යයන සහಾಯಕ AI ගුරුවරයා. භෞතික විද්‍යාව (Physics), සංයුක්ත ගණිතය (Combined Maths), රසායන විද්‍යාව (Chemistry), ජීව විද්‍යාව (Biology), ICT ඇතුළු ඕනෑම A/L විෂයයකට මගෙන් ප්‍රශ්න අසන්න පුළුවන්.</div>
    </div>

    <div id="input-container">
        <button id="mic-btn" type="button" onclick="handleMicClick()">
            <span style="font-size: 22px;">🎙️</span> 
            <span id="mic-text">කතා කරන්න</span>
        </button>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="ප්‍රශ්නයක් මෙහි ලියන්න..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">යවන්න</button>
        </div>
    </div>

    <script>
        function getApiKey() {
            let key = localStorage.getItem('gemini_api_key');
            if (!key) {
                key = prompt("කරුණාකර ඔබගේ Gemini API Key එක ඇතුළත් කරන්න:");
                if (key) {
                    localStorage.setItem('gemini_api_key', key.trim());
                }
            }
            return key ? key.trim() : "";
        }

        let isRecording = false;
        let recognition = null;
        let selectedVoice = null;
        const GEMINI_MODEL = "gemini-3.7-flash";

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            selectedVoice = voices.find(v => v.lang.includes('si') || v.lang.includes('sinhala')) || voices[0];
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function initRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                return null;
            }
            try {
                const rec = new SpeechRecognition();
                rec.lang = 'si-LK';
                rec.continuous = false;
                rec.interimResults = true;

                rec.onresult = function(event) {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    document.getElementById('user-input').value = transcript;
                };

                rec.onerror = function(event) {
                    console.error("Speech Rec Error:", event.error);
                    stopRecordingUI();
                };
                
                rec.onend = function() {
                    stopRecordingUI();
                    const val = document.getElementById('user-input').value.trim();
                    if (val) {
                        sendMessage();
                    }
                };
                return rec;
            } catch (e) {
                console.error("Init speech rec failed:", e);
                return null;
            }
        }

        recognition = initRecognition();

        function handleMicClick() {
            if (!recognition) {
                alert("ඔබගේ බ්‍රවුසරය (Browser) හඬ හඳුනාගැනීමට (Speech Recognition) සෘජුව සහය නොදක්වයි. කරුණාකර ටයිප් කර යවන්න.");
                return;
            }

            if (isRecording) {
                try {
                    recognition.stop();
                } catch(e) {}
                stopRecordingUI();
            } else {
                try {
                    window.speechSynthesis.cancel();
                    document.getElementById('user-input').value = '';
                    recognition.start();
                    startRecordingUI();
                } catch (e) {
                    console.error("Start failed:", e);
                    recognition = initRecognition();
                    try {
                        recognition.start();
                        startRecordingUI();
                    } catch (err) {
                        alert("මයික්‍රෆෝන අවසරය ලබා දී ඇත්දැයි බ්‍රවුසර සැකසුම් (Site Settings) වලින් පරීක්ෂා කරන්න.");
                        stopRecordingUI();
                    }
                }
            }
        }

        function startRecordingUI() {
            isRecording = true;
            const micBtn = document.getElementById('mic-btn');
            const micText = document.getElementById('mic-text');
            micBtn.classList.add('recording');
            micText.innerText = 'ශ්‍රවණය කරමින් පවතී... කතා කරන්න...';
            document.getElementById('user-input').placeholder = "කතා කරන්න...";
        }

        function stopRecordingUI() {
            isRecording = false;
            const micBtn = document.getElementById('mic-btn');
            const micText = document.getElementById('mic-text');
            micBtn.classList.remove('recording');
            micText.innerText = 'කතා කරන්න';
            document.getElementById('user-input').placeholder = "ප්‍රශ්නයක් මෙහි ලියන්න...";
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') { sendMessage(); }
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user', true);
            inputField.value = '';

            const apiKey = getApiKey();
            if (!apiKey) {
                alert("API Key එකක් ලබා දී නැත!");
                return;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;

            const loadingId = 'loading-' + Date.now();
            appendMessage('සිතමින් පවතී...', 'bot', false, loadingId);

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [
                                { text: "ඔබ ශ්‍රී ලංකා උසස් පෙළ (A/L) විෂය නිර්දේශයේ භෞතික විද්‍යාව (Physics), සංයුක්ත ගණිතය (Combined Maths), රසායන විද්‍යාව (Chemistry), ජීව විද්‍යාව (Biology), ICT ඇතුළු ඕනෑම විෂයයක් උගන්වන ඉතා දක්ෂ AI ගුරුවරයෙකි. සිසුන්ට සිංහල භාෂාවෙන් (අවශ්‍ය තැන්වල ඉංග්‍රීසි තාක්ෂණික වචනද සහිතව) පැහැදිලි, නිවැරදි සහ විභාග මට්ටමේ පිළිතුරු ලබා දෙන්න." }
                            ]
                        },
                        contents: [
                            {
                                parts: [
                                    { text: text }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (response.ok && data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage(reply, 'bot', false, null, true);
                } else {
                    console.error("Gemini API Error:", data);
                    const errorMsg = data.error?.message || 'සමාවන්න, දෝෂයක් සිදු විය.';
                    appendMessage('දෝෂයකි: ' + errorMsg, 'bot', true);
                }
            } catch (error) {
                console.error("Network Error:", error);
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                appendMessage('ජාල දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.', 'bot', true);
            }
        }

        function appendMessage(text, sender, isPlainText = false, id = null, addSpeakButton = false) {
            const chatContainer = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            if (id) msgDiv.id = id;

            if (sender === 'bot' && !isPlainText) {
                msgDiv.innerHTML = marked.parse(text);
                
                if (addSpeakButton) {
                    const speakBtn = document.createElement('button');
                    speakBtn.className = 'speak-btn';
                    speakBtn.innerHTML = '🔊 අහන්න';
                    speakBtn.onclick = function() {
                        speakText(text);
                    };
                    msgDiv.appendChild(speakBtn);
                }
            } else {
                msgDiv.innerText = text;
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*#_`~>\[\]()-]|<[^>]*>?/gm, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }
                
                utterance.lang = 'si-LK';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
