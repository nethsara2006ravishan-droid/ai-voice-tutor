<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Voice AI Tutor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        header {
            padding: 12px 16px;
            background: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #334155;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .ai-message {
            background: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user-message {
            background: #6366f1;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .input-area {
            padding: 12px 16px;
            background: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #334155;
        }
        input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 10px 14px;
            border-radius: 24px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #6366f1;
        }
        button {
            background: #6366f1;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:active {
            opacity: 0.8;
        }
        .icon-btn {
            background: transparent;
            padding: 8px;
            border-radius: 50%;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <span>🎙️</span>
        <span>A/L Voice AI Tutor</span>
    </header>

    <div id="chat-container">
        <div class="message ai-message">
            ආයුබෝවන්! මයික්‍රෆෝනය ඔබා කතා කර හෝ ෆොටෝ එකක් දමා ප්‍රශ්න අහන්න.
        </div>
    </div>

    <div class="input-area">
        <button class="icon-btn" id="image-btn" title="Image">📷</button>
        <button class="icon-btn" id="mic-btn" title="Voice">🎙️</button>
        <input type="text" id="user-input" placeholder="ප්‍රශ්නය ලියන්න හෝ මයික්‍රෆෝනය...">
        <button id="send-btn">യවන්න</button>
    </div>

    <script>
        // මෙතනට ඔයාගේ Google AI Studio එකෙන් ගත්තු API Key එක දාන්න (AIza...)
        const API_KEY = "AQ.Ab8RN6IolVugR4pwhGr0pbYMK6XWMvD0jNI-7rntFTMR_b3wQQ"; 
        
        // යාවත්කාලීන කළ නිවැරදි Model නම
        const MODEL_NAME = "gemini-3.8-flash";

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');

        async function callGeminiAPI(promptText) {
            if (API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
                appendMessage("දෝෂය: කරුණාකර කෝඩ් එකේ ඇතුළත නිවැරදි API Key එක ඇතුළත් කරන්න.", "ai-message");
                return;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
            
            const data = {
                contents: [{
                    parts: [{ text: "ඔබ උසස් පෙළ (A/L) සිංහල මාධ්‍ය සිසුන් සඳහා උදව් කරන දක්ෂ AI ගුරුවරයෙකි. සරලව සහ නිවැරදිව පිළිතුරු දෙන්න. ප්‍රශ්නය: " + promptText }]
                }]
            };

            try {
                appendMessage(promptText, "user-message");
                userInput.value = "";
                
                const loadingId = appendMessage("කල්පනා කරමින් පවතී...", "ai-message");

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                // ඉවත්කිරීමට ලක්වූ loading පණිවිඩය මැකීම
                chatContainer.lastChild.remove();

                if (result.candidates && result.candidates[0].content) {
                    const aiReply = result.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, "ai-message");
                    speakText(aiReply);
                } else if (result.error) {
                    appendMessage("දෝෂය: " + result.error.message, "ai-message");
                } else {
                    appendMessage("ප්‍රතිචාරයක් ලබා ගැනීමට නොහැකි විය.", "ai-message");
                }
            } catch (error) {
                chatContainer.lastChild.remove();
                appendMessage("ජාල දෝෂයක් සිදු විය: " + error.message, "ai-message");
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        // Text-to-Speech (ශබ්ද නගා කියවීම)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'si-LK';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Speech Recognition (කටහඬින් ප්‍රශ්න අසන්න)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'si-LK';
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                micBtn.style.color = '#ef4444';
            });

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                micBtn.style.color = 'white';
                callGeminiAPI(speechToText);
            };

            recognition.onerror = () => {
                micBtn.style.color = 'white';
            };
            
            recognition.onend = () => {
                micBtn.style.color = 'white';
            };
        } else {
            micBtn.style.display = 'none'; // බ්‍රවුසරය සපੋਰට් නොකරයි නම් ಮೈක් බටන් එක අයින් වේ
        }

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (text) callGeminiAPI(text);
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = userInput.value.trim();
                if (text) callGeminiAPI(text);
            }
        });
    </script>
</body>
</html>
