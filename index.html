<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L AI Tutor - ශ්‍රී ලංකා උසස් පෙළ සහායකයා</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 14px;
            text-align: center;
            font-weight: bold;
            font-size: 17px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }
        .message-box {
            padding: 14px 16px;
            border-radius: 16px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .input-panel {
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
        }
        #image-preview-container {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #eef2ff;
            border-radius: 10px;
            border: 1px solid #c7d2fe;
        }
        .action-btn {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
            transition: all 0.2s ease;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .camera-btn {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }
        .camera-btn:active {
            transform: scale(0.95);
        }
        pre code {
            display: block;
            background-color: #0f172a;
            color: #38bdf8;
            padding: 12px;
            border-radius: 10px;
            overflow-x: auto;
            font-family: monospace;
            margin: 10px 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        📚 A/L AI Tutor - උසස් පෙළ සහායකයා
    </header>

    <!-- Main Chat Container -->
    <div id="chat-container">
        <div class="message-box" style="background: white; color: #1f2937; border-bottom-left-radius: 4px;">
            ආයුබෝවන්! මම ඔබේ A/L අධ්‍යාපන සහායකයා. විෂය කරුණු, ගැටලු, හෝ ප්‍රශ්නවල ෆොටෝ අප්ලෝඩ් කර මගෙන් උත්තර ලබාගන්න!
        </div>
    </div>

    <!-- Bottom Input Panel -->
    <div class="input-panel">
        <!-- Image Preview Area -->
        <div id="image-preview-container">
            <span id="file-name" style="font-size: 12px; color: #4338ca; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
            <button onclick="removeImage()" style="background: none; border: none; color: #ef4444; font-size: 12px; font-weight: bold; cursor: pointer;">ඉවත් කරන්න</button>
        </div>

        <div style="display: flex; gap: 10px; align-items: center;">
            <!-- Hidden File Input for Images -->
            <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
            <button class="camera-btn" onclick="document.getElementById('image-input').click()" title="ප්‍රශ්නයේ ෆොටෝ එකක් එකතු කරන්න">
                📷
            </button>
            
            <input type="text" id="user-input" placeholder="ඔබේ ප්‍රශ්නය මෙතන ලියන්න..." style="flex: 1; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 14px; outline: none; font-size: 14px; background: #f8fafc; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);">
            <button class="action-btn" onclick="sendMessage()">යවන්න</button>
        </div>
    </div>

    <script>
        const API_KEY = "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"; // මෙතැනට ඔබේ Gemini API Key එක දාන්න
        let base64Image = null;

        setTimeout(() => {
            window.location.reload();
        }, 10 * 60 * 1000);

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result.split(',')[1];
                    document.getElementById('file-name').innerText = "📷 " + file.name;
                    document.getElementById('image-preview-container').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            base64Image = null;
            document.getElementById('image-input').value = '';
            document.getElementById('image-preview-container').style.display = 'none';
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const userText = inputField.value.trim();

            if (!userText && !base64Image) return;

            let userHtmlContent = userText ? `<div>${escapeHtml(userText)}</div>` : '';
            if (base64Image) {
                userHtmlContent += `<div style="margin-top: 6px;"><span style="font-size: 11px; background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 6px; color: white; font-weight: bold;">📷 පින්තූරයක් අමුණා ඇත</span></div>`;
            }

            chatContainer.innerHTML += `
                <div style="display: flex; justify-content: flex-end;">
                    <div class="message-box" style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border-bottom-right-radius: 4px;">${userHtmlContent}</div>
                </div>
            `;

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" style="display: flex; justify-content: flex-start;">
                    <div class="message-box" style="background: white; color: #64748b; border-bottom-left-radius: 4px;">සිතමින් පවතී...</div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                let parts = [];
                let promptText = "ශ්‍රී ලංකා උසස් පෙළ (A/L) විෂය නිර්දේශයට අදාළ දක්ෂ ගුරුවරයෙක් ලෙස, සිසුන්ට පහසුවෙන් වැටහෙන පරිදි පියවරෙන් පියවර (Step-by-step), පැහැදිලි ඡේද සහ ලැයිස්තු (bullet points) වලට වෙන් කර සිංහලෙන් පිළිතුරු දෙන්න: " + (userText || "මෙම ප්‍රශ්නය/පින්තූරය පරීක්ෂා කර විස්තරාත්මකව පැහැදිලි කරන්න.");
                
                parts.push({ text: promptText });

                if (base64Image) {
                    parts.push({
                        inline_data: {
                            mime_type: "image/jpeg",
                            data: base64Image
                        }
                    });
                }

                // නිවැරදි gemini-3.6-flash මොඩලය සහ v1 එන්ඩ්පොයින්ට් එක යොදා ඇත
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: parts }]
                    })
                });

                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("API සම්බන්ධතාවයේ දෝෂයක්. කරුණාකර ඔබේ API Key එක නිවැරදි දැයි පරීක්ෂා කරන්න.");
                }

                const data = await response.json();
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                removeImage();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                if (data.candidates && data.candidates.length > 0) {
                    let aiReply = data.candidates[0].content.parts[0].text;
                    
                    let formattedReply = aiReply
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>');

                    chatContainer.innerHTML += `
                        <div style="display: flex; justify-content: flex-start;">
                            <div class="message-box" style="background: white; color: #1f2937; border-bottom-left-radius: 4px;">
                                ${formattedReply}
                            </div>
                        </div>
                    `;
                } else {
                    chatContainer.innerHTML += `
                        <div style="display: flex; justify-content: flex-start;">
                            <div class="message-box" style="background: #fef2f2; color: #991b1b;">පිළිතුරක් ලැබී නැත.</div>
                        </div>
                    `;
                }
            } catch (error) {
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();
                chatContainer.innerHTML += `
                    <div style="display: flex; justify-content: flex-start;">
                        <div class="message-box" style="background: #fef2f2; color: #991b1b;">දෝෂයකි: ${error.message}</div>
                    </div>
                `;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
