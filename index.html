<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Voice AI Tutor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            overflow: hidden;
        }
        header {
            padding: 12px 16px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.bot {
            background: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .message.user {
            background: #3b82f6;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        /* Voice button inside bot messages */
        .speak-btn {
            background: #334155;
            border: none;
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .speak-btn:hover {
            background: #475569;
        }
        /* Mobile responsive tables */
        .message.bot table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 13px;
        }
        .message.bot th, .message.bot td {
            border: 1px solid #475569;
            padding: 8px;
            text-align: left;
        }
        .message.bot th {
            background: #334155;
            color: #38bdf8;
        }
        .message.bot ul, .message.bot ol {
            margin-left: 20px;
            margin-top: 5px;
        }
        #input-container {
            padding: 12px;
            background: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #334155;
        }
        #user-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 10px 14px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }
        #user-input::placeholder {
            color: #64748b;
        }
        button {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        button#mic-btn.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
    <!-- Marked.js for rendering markdown & tables nicely -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <header>
        <div class="header-title">
            <span>🧠</span>
            <span>A/L ICT Tutor</span>
        </div>
    </header>

    <div id="chat-container">
        <div class="message bot">ආයුබෝවන්! මම ශ්‍රී ලංකා A/L ICT විෂය නිර්දේශයට අදාළව උගන්වන AI ටියුටර්. ඔබට අවශ්‍ය ප්‍රශ්නයක් අසන්න හෝ කතා කරන්න.</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="ප්‍රශ්නයක් මෙහි ලියන්න..." onkeypress="handleKeyPress(event)">
        <button id="mic-btn" onclick="toggleSpeechRecognition()">🎤 කතා කරන්න</button>
        <button onclick="sendMessage()">යවන්න</button>
    </div>

    <script>
        function getApiKey() {
            let key = localStorage.getItem('gemini_api_key');
            if (!key) {
                key = prompt("කරුණාකර ඔබගේ Gemini API Key එක ඇතුළත් කරන්න:");
                if (key) {
                    localStorage.setItem('gemini_api_key', key.trim());
                }
            }
            return key ? key.trim() : "";
        }

        let isRecording = false;
        let recognition = null;
        let selectedVoice = null;
        const GEMINI_MODEL = "gemini-3.7-flash";

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            selectedVoice = voices.find(v => v.lang.includes('si') || v.lang.includes('sinhala')) || voices[0];
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        // Setup Speech Recognition (STT)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'si-LK';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                stopRecordingUI();
                sendMessage();
            };

            recognition.onerror = function(event) {
                console.error("Speech Recognition Error:", event.error);
                stopRecordingUI();
            };
            
            recognition.onend = function() {
                stopRecordingUI();
            };
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') { sendMessage(); }
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert('ඔබගේ බ්‍රවුසරය කටහඬ හඳුනාගැනීම සඳහා සහය නොදක්වයි.');
                return;
            }
            if (isRecording) {
                recognition.stop();
                stopRecordingUI();
            } else {
                try {
                    window.speechSynthesis.cancel();
                    recognition.start();
                    startRecordingUI();
                } catch (e) {
                    console.error(e);
                    recognition.stop();
                    stopRecordingUI();
                }
            }
        }

        function startRecordingUI() {
            isRecording = true;
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('recording');
            micBtn.innerText = '🛑 නතර කරන්න';
            document.getElementById('user-input').placeholder = "ශ්‍රවණය කරමින් පවතී... කතා කරන්න.";
        }

        function stopRecordingUI() {
            isRecording = false;
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.remove('recording');
            micBtn.innerText = '🎤 කතා කරන්න';
            document.getElementById('user-input').placeholder = "ප්‍රශ්නයක් මෙහි ලියන්න...";
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user', true);
            inputField.value = '';

            const apiKey = getApiKey();
            if (!apiKey) {
                alert("API Key එකක් ලබා දී නැත!");
                return;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;

            const loadingId = 'loading-' + Date.now();
            appendMessage('සිතමින් පවතී...', 'bot', false, loadingId);

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [
                                { text: "ඔබ ශ්‍රී ලංකා උසස් පෙළ (A/L) ICT (තොරතුරු හා සන්නිවේදන තාක්ෂණ) විෂය නිර්දේශය උගන්වන ඉතා දක්ෂ AI ටියුටර් කෙනෙකි. සෑම විටම සිසුන්ට තේරුම් ගැනීමට පහසු වන පරිදි සිංහල භාෂාවෙන් (අවශ්‍ය තැන්වල ඉංග්‍රීසි තාක්ෂණික වචනද සහිතව) පැහැදිලි, නිවැරදි සහ විභාග මට්ටමේ පිළිතුරු ලබා දෙන්න." }
                            ]
                        },
                        contents: [
                            {
                                parts: [
                                    { text: text }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (response.ok && data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage(reply, 'bot', false, null, true); // Pass true to enable speech button
                } else {
                    console.error("Gemini API Error:", data);
                    const errorMsg = data.error?.message || 'සමාවන්න, දෝෂයක් සිදු විය.';
                    appendMessage('දෝෂයකි: ' + errorMsg, 'bot', true);
                }
            } catch (error) {
                console.error("Network Error:", error);
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                appendMessage('ජාල දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.', 'bot', true);
            }
        }

        function appendMessage(text, sender, isPlainText = false, id = null, addSpeakButton = false) {
            const chatContainer = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            if (id) msgDiv.id = id;

            if (sender === 'bot' && !isPlainText) {
                msgDiv.innerHTML = marked.parse(text);
                
                // Add a listen button if requested
                if (addSpeakButton) {
                    const speakBtn = document.createElement('button');
                    speakBtn.className = 'speak-btn';
                    speakBtn.innerHTML = '🔊 අහන්න';
                    speakBtn.onclick = function() {
                        speakText(text);
                    };
                    msgDiv.appendChild(speakBtn);
                }
            } else {
                msgDiv.innerText = text;
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*#_`~>\[\]()-]|<[^>]*>?/gm, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }
                
                utterance.lang = 'si-LK';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
