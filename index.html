<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Voice AI Tutor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            overflow: hidden;
        }
        header {
            padding: 12px 16px;
            background: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.bot {
            background: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .message.user {
            background: #3b82f6;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        #input-container {
            padding: 12px;
            background: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #334155;
        }
        #user-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 10px 14px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }
        #user-input::placeholder {
            color: #64748b;
        }
        button {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        button#mic-btn.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <span>🧠</span>
        <span>A/L Voice AI Tutor (Groq)</span>
    </header>

    <div id="chat-container">
        <div class="message bot">ආයුබෝවන්! මම ඔබේ A/L AI ටියුටර්. ඔබට අවශ්‍ය ප්‍රශ්නයක් අසන්න.</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="ප්‍රශ්නයක් මෙහි ලියන්න හෝ මයික්‍රෆෝනය ඔබන්න...">
        <button id="mic-btn" onclick="toggleSpeechRecognition()">🎤 කතා කරන්න</button>
        <button onclick="sendMessage()">යවන්න</button>
    </div>

    <script>
        // මෙන්න මෙතනට ඔයාගේ Groq API Key එක දාන්න 👇
        const GROQ_API_KEY = "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"; 
        const GROQ_MODEL = "llama3-8b-8192";

        let isRecording = false;
        let recognition = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'si-LK';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                stopRecordingUI();
                sendMessage();
            };

            recognition.onerror = function(event) {
                stopRecordingUI();
            };

            recognition.onend = function() {
                stopRecordingUI();
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert('ඔබගේ බ්‍රවුසරය කටහඬ හඳුනාගැනීම සඳහා සහය නොදක්වයි.');
                return;
            }
            if (isRecording) {
                recognition.stop();
                stopRecordingUI();
            } else {
                try {
                    recognition.start();
                    startRecordingUI();
                } catch (e) {
                    recognition.stop();
                    stopRecordingUI();
                }
            }
        }

        function startRecordingUI() {
            isRecording = true;
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('recording');
            micBtn.innerText = '🛑 නතර කරන්න';
            document.getElementById('user-input').placeholder = "श्रවණය කරමින් පවතී...";
        }

        function stopRecordingUI() {
            isRecording = false;
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.remove('recording');
            micBtn.innerText = '🎤 කතා කරන්න';
            document.getElementById('user-input').placeholder = "ප්‍රශ්නයක් මෙහි ලියන්න හෝ මයික්‍රෆෝනය ඔබන්න...";
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            inputField.value = '';

            const loadingId = 'loading-' + Date.now();
            appendMessage('සිතමින් පවතී...', 'bot', loadingId);

            try {
                // CORS ප්‍රශ්නය මඟහරවා ගැනීමට proxy හරහා හෝ mode වෙනස් කර රික්වෙස්ට් යැවීම
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY.trim()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: GROQ_MODEL,
                        messages: [
                            {
                                role: "system",
                                content: "You are a helpful A/L educational AI tutor in Sri Lanka. Always reply in clear Sinhala language."
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (response.ok && data.choices && data.choices.length > 0) {
                    const reply = data.choices[0].message.content;
                    appendMessage(reply, 'bot');
                    speakText(reply);
                } else {
                    console.error("Groq API Error:", data);
                    const errorMsg = data.error?.message || 'සමාවන්න, දෝෂයක් සිදු විය.';
                    appendMessage('දෝෂයකි: ' + errorMsg, 'bot');
                }
            } catch (error) {
                console.error("Network/CORS Error:", error);
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                appendMessage('ජාල දෝෂයක් (Network/CORS) සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.', 'bot');
            }
        }

        function appendMessage(text, sender, id = null) {
            const chatContainer = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            if (id) msgDiv.id = id;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/<[^>]*>?/gm, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'si-LK';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
